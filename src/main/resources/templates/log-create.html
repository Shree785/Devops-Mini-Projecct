<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingest Security Log - Security Log Review System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('newLog')}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/logs}">Logs</a></li>
                    <li class="breadcrumb-item active">New Log Ingestion</li>
                </ol>
            </nav>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h4 class="card-title mb-0 fw-bold" id="formHeader">
                        <i class="bi bi-shield-plus text-primary me-2"></i>Ingest New Security Event
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/logs/new}" th:object="${securityLog}" method="post" id="createLogForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="eventTypeInput" class="form-label fw-semibold">Event Type <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="eventTypeInput" th:field="*{eventType}" 
                                       placeholder="e.g. UNAUTHORIZED_ACCESS, PORT_SCAN, BRUTE_FORCE" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('eventType')}" th:errors="*{eventType}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="severitySelect" class="form-label fw-semibold">Severity Rating <span class="text-danger">*</span></label>
                                <select class="form-select" id="severitySelect" th:field="*{severity}" required>
                                    <option value="" disabled selected>-- Select Severity Level --</option>
                                    <option th:each="sev : ${allSeverities}" th:value="${sev}" th:text="${sev}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('severity')}" th:errors="*{severity}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="sourceIpInput" class="form-label fw-semibold">Source IP <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="sourceIpInput" th:field="*{sourceIp}" 
                                       placeholder="e.g. 192.168.1.100" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('sourceIp')}" th:errors="*{sourceIp}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="destinationIpInput" class="form-label fw-semibold">Destination IP</label>
                                <input type="text" class="form-control" id="destinationIpInput" th:field="*{destinationIp}" 
                                       placeholder="e.g. 10.0.0.1 (optional)">
                            </div>

                            <div class="col-12">
                                <label for="messageInput" class="form-label fw-semibold">Log Payload / Message <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="messageInput" th:field="*{message}" rows="4" 
                                          placeholder="Enter detailed raw event payload, headers, or diagnostic details..." required></textarea>
                                <div class="text-danger small" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
                            </div>

                            <div class="col-12 mt-4 d-flex justify-content-between">
                                <a th:href="@{/logs}" class="btn btn-outline-secondary" id="cancelBtn">
                                    <i class="bi bi-x-circle me-1"></i>Cancel
                                </a>
                                <button type="submit" class="btn btn-primary px-4" id="submitLogBtn">
                                    <i class="bi bi-save me-1"></i>Submit & Ingest Log
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
