<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<nav th:fragment="navbar(activeTab)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" id="navBrand" th:href="@{/logs}">
            <i class="bi bi-shield-lock-fill text-warning me-2"></i>Security Log Review System
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" id="navLogs" th:classappend="${activeTab == 'logs'} ? ' active' : ''" th:href="@{/logs}">
                        <i class="bi bi-journal-text me-1"></i>Security Logs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="navNewLog" th:classappend="${activeTab == 'newLog'} ? ' active' : ''" th:href="@{/logs/new}">
                        <i class="bi bi-plus-circle me-1"></i>Ingest Log
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-white">
                <span class="badge bg-secondary me-2" id="envBadge">ENV: PRODUCTION</span>
                <span class="badge bg-success" id="systemStatusBadge"><i class="bi bi-circle-fill me-1" style="font-size: 8px;"></i>ONLINE</span>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
