# ==============================================================================
# Ansible Managed Configuration: security-log-review (production)
# Managed by Ansible - Changes will be overwritten
# Target Host: localhost
# ==============================================================================

server.port=8080
server.servlet.context-path=/

# Datasource Configuration
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf Template Engine
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Actuator Operational Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging Posture
logging.level.root=INFO
logging.level.com.securitylog=INFO
logging.file.name=/workspace/ansible/runtime/var/log/security-log-review/application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
